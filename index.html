<html lang="vi">
<head>
<meta charset="UTF-8">

<title>Carmel Coffee — quiet moments grow...</title>
<meta name="description" content="Carmel Coffee — 30/49 Đỗ Nhuận, Tân Sơn Nhì, TP.HCM. Một góc yên tĩnh để những khoảnh khắc được lớn lên.">

<style>
  :root{
    --cream:#F5EAD0;
    --paper:#EFE0B9;
    --paper-line:rgba(74,46,29,.18);
    --mustard:#C9A24E;
    --mustard-deep:#A9822F;
    --espresso:#4A2E1D;
    --espresso-deep:#2E1B10;
    --charcoal:#1E1A15;
    --terracotta:#B85C22;
    --terracotta-deep:#8F4517;
    --sage:#5E6B3D;
    --gold:#D8AE4D;
    --cream-soft:#FAF3E1;
    --shadow: 0 18px 40px -20px rgba(30,20,10,.45);
    --radius: 4px;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--espresso-deep);
    font-family:'Be Vietnam Pro', sans-serif;
    font-weight:400;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  img{max-width:100%;display:block;}
  a{color:inherit; text-decoration:none;}
  ul{margin:0;padding:0;list-style:none;}
  h1,h2,h3,h4{margin:0; font-family:'Baloo 2', sans-serif; font-weight:800; color:var(--espresso-deep);}
  p{margin:0;}
  .wrap{max-width:1180px; margin:0 auto; padding:0 24px;}
  @media (max-width:640px){ .wrap{padding:0 18px;} }

  .eyebrow{
    font-family:'Space Mono', monospace;
    text-transform:uppercase;
    letter-spacing:.18em;
    font-size:.72rem;
    color:var(--terracotta-deep);
    display:inline-flex;
    align-items:center;
    gap:.6em;
  }
  .eyebrow::before{
    content:'';
    width:22px; height:1px;
    background:var(--terracotta-deep);
    display:inline-block;
  }

  .fill{
    border-bottom:2px dashed var(--terracotta);
    color:var(--terracotta-deep);
    padding:0 .15em;
    font-style:normal;
  }

  /* checkerboard motif — pulled straight from the shop's real menu-board border */
  .checker{
    height:14px;
    background-image:
      repeating-conic-gradient(var(--espresso-deep) 0% 25%, var(--cream-soft) 0% 50%);
    background-size:14px 14px;
    background-position:0 0;
  }
  .checker.thin{height:8px; background-size:8px 8px;}

  /* ---------- HEADER ---------- */
  header{
    position:fixed; top:0; left:0; right:0; z-index:100;
    background:transparent;
    transition:background .35s ease, box-shadow .35s ease, padding .35s ease;
    padding:18px 0;
  }
  header.solid{
    background:var(--cream-soft);
    box-shadow:0 6px 24px -14px rgba(30,20,10,.4);
    padding:10px 0;
  }
  header .bar{display:flex; align-items:center; justify-content:space-between; gap:20px;}
  .brandmark{
    font-family:'Bagel Fat One', cursive;
    font-size:1.5rem;
    color:var(--cream-soft);
    letter-spacing:.01em;
    transition:color .35s ease;
    display:flex; align-items:baseline; gap:8px;
  }
  header.solid .brandmark{color:var(--espresso-deep);}
  .brandmark small{
    font-family:'Space Mono', monospace;
    font-size:.55rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--gold);
    font-weight:700;
  }
  nav.mainnav{display:flex; align-items:center; gap:34px;}
  nav.mainnav a{
    font-family:'Space Mono', monospace;
    font-size:.78rem;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--cream-soft);
    position:relative;
    padding-bottom:4px;
    transition:color .35s ease;
  }
  header.solid nav.mainnav a{color:var(--espresso);}
  nav.mainnav a::after{
    content:'';
    position:absolute; left:0; bottom:0; height:2px; width:0;
    background:var(--terracotta);
    transition:width .25s ease;
  }
  nav.mainnav a:hover::after{width:100%;}
  .cta-btn{
    font-family:'Space Mono', monospace;
    font-size:.75rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:var(--terracotta);
    color:var(--cream-soft);
    padding:11px 20px;
    border-radius:2px;
    border:1px solid var(--terracotta);
    white-space:nowrap;
    transition:background .25s ease, color .25s ease, transform .2s ease;
    display:inline-block;
  }
  .cta-btn:hover{background:var(--terracotta-deep); transform:translateY(-1px);}
  .cta-btn.ghost{
    background:transparent;
    color:var(--cream-soft);
    border:1px solid rgba(245,234,208,.55);
  }
  header.solid .cta-btn.ghost{color:var(--espresso); border-color:rgba(74,46,29,.35);}
  .cta-btn.ghost:hover{background:rgba(245,234,208,.12);}
  header.solid .cta-btn.ghost:hover{background:rgba(74,46,29,.08);}
